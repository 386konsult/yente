services:
  traefik:
    image: traefik:v3
    container_name: adhere_opensanctions_traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/acme.json:/acme.json
    command:
      - "--configFile=/traefik.yml"

  index:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    expose:
      - "9200"
    ports:
      - "127.0.0.1:9200:9200"
    container_name: index
    environment:
      - node.name=index
      - cluster.name=opensanctions-index
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - index-os-data:/usr/share/elasticsearch/data
    healthcheck:
      # curl --fail exits with an exit code >0 if anything about the request fails
      test:
        [
          "CMD-SHELL",
          "curl --fail http://localhost:9200/_cluster/health || exit 1",
        ]
    deploy:
      placement:
        max_replicas_per_node: 2
      restart_policy:
        condition: on-failure

  app:
    image: ghcr.io/opensanctions/yente:5.5.0
    depends_on:
      index:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - YENTE_AUTO_REINDEX=false
    # If you want to index data from the host machine as a custom dataset,
    # create a volume mount here to make that data accessible from the
    # container:
    # volumes:
    #   - "/path/on/the/host/computer:/data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3s
    deploy:
      mode: replicated
      # Run multiple instances for better scale:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`opensanctions.smartcomply.com`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=8000"

  reindexer:
    image: ghcr.io/opensanctions/yente:5.5.0
    container_name: reindexer
    depends_on:
      index:
        condition: service_healthy
    env_file:
      - .env
    command: ["yente", "reindex"]
    restart: "no"
    profiles:
      - reindex
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  cron-scheduler:
    image: quay.io/panubo/cron:latest
    container_name: cron-scheduler
    depends_on:
      index:
        condition: service_healthy
    user: root
    volumes:
      - ./crontab.txt:/crontab:ro
      - .:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
    environment:
      - TZ=UTC
    entrypoint: ["/usr/local/bin/go-crond"]
    command: ["--default-user=root", "--working-directory=/app", "/crontab"]
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s

volumes:
  index-os-data:
